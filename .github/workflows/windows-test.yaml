name: Windows Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Build-Windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CMake build
        shell: bash
        run: |
          mkdir cmake_build
          cd cmake_build
          cmake -A x64 ..
          cmake --build . --config Release --parallel
          ctest -C Release --output-on-failure --no-tests=error
