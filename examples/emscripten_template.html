<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <meta name="theme-color" content="#13181c">
    <title>Visage</title>
    <style>
        html {
            height: 100%;
            color-scheme: dark;
            background-color: #13181c;
            overscroll-behavior: none;
        }

        body {
            margin: 0;
            height: 100%;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                radial-gradient(ellipse at center, rgb(19 24 28 / 0) 25%, #13181c 85%),
                radial-gradient(circle, rgb(190 205 215 / 0.24) 1px, rgb(190 205 215 / 0) 1.5px);
            background-size: auto, 24px 24px;
            background-position: center;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
        canvas.emscripten {
            display: block;
            flex: none;
            margin: auto;
            border: 0 none;
            border-radius: 10px;
            outline: none;
            background-color: black;
            box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08), 0 20px 60px rgb(0 0 0 / 0.55);
            opacity: 0;
            touch-action: none;
            transition: opacity 0.35s ease;
        }

        canvas.emscripten.running {
            opacity: 1;
        }

        canvas.emscripten.fills-window {
            border-radius: 0;
            box-shadow: none;
        }

        .loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #8d9aa3;
            font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            letter-spacing: 0.02em;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .loader[hidden] {
            display: none;
        }

        .loader.finished {
            opacity: 0;
        }

        .loader.failed {
            z-index: 2;
        }

        #status {
            animation: appear 0.3s ease 0.15s backwards;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: conic-gradient(rgb(160 124 240 / 0), #a07cf0);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), black calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), black calc(100% - 2.5px));
            animation: spin 0.9s linear infinite, appear 0.3s ease 0.15s backwards;
        }

        .loader.failed .spinner {
            display: none;
        }

        .loader.failed #status {
            margin: 0 16px;
            padding: 10px 16px;
            border-radius: 8px;
            color: #ffb4ab;
            background-color: rgb(19 24 28 / 0.92);
            text-align: center;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
<div class="loader" id="loader" role="status">
    <div class="spinner"></div>
    <div id="status">Loading</div>
</div>
<div class="container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
</div>
<script type='text/javascript'>
    var loaderElement = document.getElementById('loader');
    var statusElement = document.getElementById('status');
    var canvas = document.getElementById('canvas');
    var running = false;
    var failed = false;

    function showError(text) {
        failed = true;
        statusElement.textContent = text;
        loaderElement.hidden = false;
        loaderElement.classList.add('failed');
        loaderElement.classList.remove('finished');
    }

    function startRunning() {
        if (running || failed) return;
        running = true;
        window.dispatchEvent(new Event('resize'));
        requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            canvas.classList.add('running');
            loaderElement.classList.add('finished');
            setTimeout(() => loaderElement.hidden = !failed, 200);
        }));
    }

    function updateFillsWindow() {
        var fills = canvas.offsetWidth >= window.innerWidth && canvas.offsetHeight >= window.innerHeight;
        canvas.classList.toggle('fills-window', fills);
    }

    new ResizeObserver(updateFillsWindow).observe(canvas);
    window.addEventListener('resize', updateFillsWindow);

    var activeTouch = null;

    function sendMouseEvent(type, touch, buttons) {
        canvas.dispatchEvent(new MouseEvent(type, {
            bubbles: true,
            clientX: touch.clientX,
            clientY: touch.clientY,
            buttons: buttons
        }));
    }

    function findActiveTouch(event) {
        return Array.from(event.changedTouches).find((touch) => touch.identifier === activeTouch);
    }

    function endTouch(event) {
        var touch = findActiveTouch(event);
        if (!touch) return;
        activeTouch = null;
        sendMouseEvent('mouseup', touch, 0);
    }

    canvas.addEventListener('touchstart', (event) => {
        event.preventDefault();
        if (activeTouch !== null) return;
        var touch = event.changedTouches[0];
        activeTouch = touch.identifier;
        sendMouseEvent('mousemove', touch, 0);
        sendMouseEvent('mousedown', touch, 1);
    }, {passive: false});

    canvas.addEventListener('touchmove', (event) => {
        event.preventDefault();
        var touch = findActiveTouch(event);
        if (touch) sendMouseEvent('mousemove', touch, 1);
    }, {passive: false});

    canvas.addEventListener('touchend', endTouch);
    canvas.addEventListener('touchcancel', endTouch);

    function reportFailure() {
        showError(running ? 'Exception thrown, see JavaScript console' : 'Failed to start, see JavaScript console');
    }

    var Module = {
        canvas: canvas,
        setStatus: (text) => {
            if (!text) startRunning();
        },
        onAbort: reportFailure
    };

    window.addEventListener('error', reportFailure, true);
    window.addEventListener('unhandledrejection', reportFailure);
</script>

</body>
</html>
